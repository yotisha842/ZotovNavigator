name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify
      - run: ./mvnw -B -f crawler-service/pom.xml verify
      - name: Check JavaScript syntax
        run: |
          for file in src/main/resources/static/js/*.js src/main/resources/static/service-worker.js; do
            node --input-type=module --check < "$file"
          done
