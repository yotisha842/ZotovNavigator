<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зотов.Навигатор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
<div id="app">

    <!-- ШАПКА -->
    <header class="header">
        <div class="brand">
            <img class="brand__logo"
                 src="https://centrezotov.ru/wp-content/themes/zotov/assets/img/mob-logo-white.svg"
                 alt="Центр Зотов" height="36">
            <span class="brand__divider"></span>
            <span class="brand__name">НАВИГАТОР</span>
        </div>
        <div class="search">
            <input id="searchInput" class="search__input" type="text"
                   placeholder="Поиск: лекторий, кафе, выставка…" autocomplete="off">
            <div id="searchResults" class="search__results" hidden></div>
        </div>
        <div class="header__actions">
            <button class="btn btn--ghost events-menu-btn" id="eventsMenuToggle">
                Мероприятия <span class="events-menu-arrow">▾</span>
            </button>
            <button class="btn btn--ghost" id="chatHeaderBtn" title="ИИ-ассистент">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:middle">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>ИИ-ассистент
            </button>
        </div>
    </header>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="stage">
        <!-- Переключатель этажей -->
        <nav class="floors" id="floorSwitcher" aria-label="Этажи"></nav>

        <!-- Переключатель лестница/лифт -->
        <div id="transportToggle" class="transport-toggle">
            <button class="transport-btn is-active" data-transport="stairs" title="Лестница">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 20 4 14 10 14 10 8 16 8 16 4"/>
                </svg>
            </button>
            <button class="transport-btn" data-transport="elevator" title="Лифт">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                    <path d="M9 10l3-3 3 3M9 14l3 3 3-3"/>
                </svg>
            </button>
        </div>

        <!-- 3D-сцена -->
        <div id="sceneContainer" class="scene">
            <div id="tooltip" class="tooltip" hidden></div>
            <div id="loading" class="loading">Загрузка модели здания…</div>
        </div>

        <!-- Правая панель: детали зоны / маршрут / афиша -->
        <aside id="panel" class="panel" hidden>
            <button id="panelClose" class="panel__close" aria-label="Закрыть">×</button>
            <div id="panelContent" class="panel__content"></div>
        </aside>
    </main>

    <!-- ФУТЕР: режимы -->
    <footer class="modes" id="modeSwitcher">
        <span class="modes__label">Режим</span>
        <button class="mode is-active" data-mode="first">Я впервые</button>
        <button class="mode" data-mode="event">На мероприятие</button>
        <button class="mode" data-mode="all">Всё посмотреть</button>
        <button class="mode" data-mode="kids">С детьми</button>
        <button class="mode" data-mode="plan">План дня</button>
    </footer>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
