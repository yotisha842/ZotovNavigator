server:
  port: 8080

spring:
  application:
    name: zotov-navigator
  datasource:
    url: jdbc:h2:mem:zotov;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    # data.sql должен выполняться ПОСЛЕ создания схемы Hibernate
    defer-datasource-initialization: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: zotov-navigator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.zotov.navigator.kafka.EventMessage
        spring.json.use.type.headers: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# --- Зотов.Навигатор: интеграция ---
zotov:
  scraper:
    enabled: false          # true → парсить centrezotov.ru раз в час
    interval-ms: 3600000    # интервал синхронизации (мс), default 1 час
  embed:
    allowed-origins: "*"    # frame-ancestors для iframe; в prod → https://centrezotov.ru

app:
  kafka:
    # Слушатель Kafka можно выключить (например, если брокер не поднят локально): KAFKA_ENABLED=false
    enabled: ${KAFKA_ENABLED:true}
    events-topic: ${EVENTS_TOPIC:zotov.events}
