spring:
  application:
    name: zotov-events-crawler
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  crawler:
    afisha-url: ${AFISHA_URL:https://centrezotov.ru/events/}
    events-topic: ${EVENTS_TOPIC:zotov.events}
    # Первый прогон — почти сразу после старта, дальше — раз в час
    initial-delay-ms: 5000
    interval-ms: 3600000

logging:
  level:
    ru.zotov.crawler: INFO
